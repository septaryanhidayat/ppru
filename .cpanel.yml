---
deployment:
  tasks:
    # ==============================================================================
    # KHUSUS DOMAIN PPRU.AC.ID
    # PERINGATAN: JANGAN PERNAH MENGARAHKAN KE /home/pesonaas/public_html
    # agar website utama cPanel Anda tidak terganggu/tertimpa sama sekali.
    # ==============================================================================
    - 'export DEPLOYPATH=/home/pesonaas/ppru.ac.id'
    - 'if [ -d "/home/pesonaas/public_html/ppru.ac.id" ]; then export DEPLOYPATH=/home/pesonaas/public_html/ppru.ac.id; fi'
    - 'if [ "$PWD" != "$DEPLOYPATH" ]; then /bin/mkdir -p $DEPLOYPATH; fi'
    - 'if [ "$PWD" != "$DEPLOYPATH" ]; then /bin/mkdir -p $DEPLOYPATH/storage/framework/cache/data $DEPLOYPATH/storage/framework/sessions $DEPLOYPATH/storage/framework/views $DEPLOYPATH/storage/logs $DEPLOYPATH/bootstrap/cache $DEPLOYPATH/public/uploads; fi'
    - 'if [ "$PWD" != "$DEPLOYPATH" ]; then /bin/cp -R app bootstrap config database public resources routes storage artisan composer.json composer.lock .htaccess $DEPLOYPATH/; fi'
    - '/bin/chmod -R 775 $DEPLOYPATH/storage $DEPLOYPATH/bootstrap/cache'
    - '/bin/chmod -R 755 $DEPLOYPATH/public/uploads'
    - '/bin/touch $DEPLOYPATH/public/index.php'
    - '(cd $DEPLOYPATH && (php artisan migrate --force || /usr/local/bin/php artisan migrate --force || /opt/cpanel/ea-php84/root/usr/bin/php artisan migrate --force || true))'
    - '(cd $DEPLOYPATH && (php artisan optimize:clear || /usr/local/bin/php artisan optimize:clear || /opt/cpanel/ea-php84/root/usr/bin/php artisan optimize:clear || true))'
