---
deployment:
  tasks:
    # ==============================================================================
    # PONDOK PESANTREN RAUDHATUL ULUM (PPRU) - CPANEL DEPLOYMENT CONFIGURATION
    # Document Root domain ppru.ac.id : repositories/ppru/public
    # Project Repository Root         : /home/pesonaas/repositories/ppru
    #
    # PERINGATAN: Konfigurasi ini HANYA bekerja di dalam repositories/ppru.
    # SAMA SEKALI TIDAK MENYENTUH /home/pesonaas/public_html (web utama aman 100%).
    # ==============================================================================
    - "export DEPLOYPATH=/home/pesonaas/repositories/ppru"
    - "/bin/mkdir -p $DEPLOYPATH/storage/framework/cache/data $DEPLOYPATH/storage/framework/sessions $DEPLOYPATH/storage/framework/views $DEPLOYPATH/storage/logs $DEPLOYPATH/bootstrap/cache $DEPLOYPATH/public/uploads"
    - "/bin/chmod -R 775 $DEPLOYPATH/storage $DEPLOYPATH/bootstrap/cache"
    - "/bin/chmod -R 755 $DEPLOYPATH/public/uploads"
    - "(cd $DEPLOYPATH && (php artisan storage:link || true))"
    - "(cd $DEPLOYPATH && (php artisan migrate --force || /usr/local/bin/php artisan migrate --force || /opt/cpanel/ea-php84/root/usr/bin/php artisan migrate --force || true))"
    - "(cd $DEPLOYPATH && (php artisan optimize:clear || /usr/local/bin/php artisan optimize:clear || /opt/cpanel/ea-php84/root/usr/bin/php artisan optimize:clear || true))"
