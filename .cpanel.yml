---
deployment:
  tasks:
    # ------------------------------------------------------------------------
    # cPanel Automatic Deployment Configuration
    # Sesuaikan DEPLOYPATH dengan direktori tujuan di cPanel Anda
    # Default domain utama biasanya: /home/$USER/public_html/
    # ------------------------------------------------------------------------
    - export DEPLOYPATH=${DEPLOYPATH:-/home/$USER/public_html/}
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH
    - /bin/chmod -R 755 $DEPLOYPATH/storage $DEPLOYPATH/bootstrap/cache
