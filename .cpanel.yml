---
deployment:
  tasks:
    # ------------------------------------------------------------------------
    # cPanel Git Version Control Deployment for smaitishumpbm.sch.id
    # Document Root: /home/berandad/repositories/smaitishum/public
    # ------------------------------------------------------------------------
    - export DEPLOYPATH=/home/berandad/repositories/smaitishum
    - /bin/chmod -R 775 $DEPLOYPATH/storage $DEPLOYPATH/bootstrap/cache || true
    - /bin/chmod -R 755 $DEPLOYPATH/public/uploads || true
    - /bin/touch $DEPLOYPATH/public/index.php $DEPLOYPATH/public/.htaccess || true
    - killall -9 lsphp 2>/dev/null || true
