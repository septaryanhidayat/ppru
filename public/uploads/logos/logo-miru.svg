<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="grad-MIRU" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow-MIRU" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Outer Shield / Circle -->
  <circle cx="50" cy="50" r="47" fill="url(#grad-MIRU)" filter="url(#shadow-MIRU)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#facc15" stroke-width="2"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2,2"/>
  
  <!-- Graphic Symbol -->
  <g transform="translate(0, -6)">
    <path d="M50 24 L72 40 L50 56 L28 40 Z" fill="#facc15"/><rect x="42" y="56" width="16" height="12" fill="#ffffff" rx="1"/>
  </g>
  
  <!-- Banner Ribbons & Label -->
  <path d="M18 70 Q50 63 82 70 L80 82 Q50 76 20 82 Z" fill="#ffffff" filter="url(#shadow-MIRU)"/>
  <text x="50" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="9" fill="#064e3b" letter-spacing="0.5">MIRU</text>
  
  <!-- Bottom Text -->
  <text x="50" y="90" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="4.5" fill="#ffffff" letter-spacing="0.8">PPRU SAKATIGA</text>
</svg>