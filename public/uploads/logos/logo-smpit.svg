      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="shadow-SMPIT" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Outer Shield / Circle -->
  <circle cx="50" cy="50" r="47" fill="url(#grad-SMPIT)" filter="url(#shadow-SMPIT)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2,2"/>
  
  <!-- Graphic Symbol -->
