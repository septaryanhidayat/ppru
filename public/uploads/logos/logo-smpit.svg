  <text x="50" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="9" fill="#075985" letter-spacing="0.5">SMPIT</text>
  
  <!-- Bottom Text -->
  <text x="50" y="90" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="4.5" fill="#ffffff" letter-spacing="0.8">PPRU SAKATIGA</text>
