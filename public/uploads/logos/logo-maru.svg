      <stop offset="0%" stop-color="#00843d"/>
      <stop offset="100%" stop-color="#055428"/>
    </linearGradient>
    <filter id="shadow-MARU" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Outer Shield / Circle -->
  <circle cx="50" cy="50" r="47" fill="url(#grad-MARU)" filter="url(#shadow-MARU)"/>
