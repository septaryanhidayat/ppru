<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="gradGreen2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#166534" />
            <stop offset="100%" stop-color="#0d6b38" />
        </linearGradient>
        <linearGradient id="gradOrange2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fb923c" />
            <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>
        <linearGradient id="gradGold2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
        <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2" />
        </filter>
    </defs>

    <!-- Outer Circular Badge Frame with Stars -->
    <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="url(#gradGreen2)" stroke-width="4" filter="url(#shadow2)" />
    <circle cx="100" cy="100" r="88" fill="none" stroke="url(#gradGold2)" stroke-width="2" stroke-dasharray="4,2" />

    <!-- Center Shield -->
    <g transform="translate(45, 20)">
        <path d="M 55,5 Q 95,5 102,30 Q 105,75 55,105 Q 5,75 8,30 Q 15,5 55,5 Z" fill="url(#gradGold2)" />
        <path d="M 55,9 Q 91,9 97,32 Q 100,72 55,99 Q 10,72 13,32 Q 19,9 55,9 Z" fill="url(#gradGreen2)" stroke="#ffffff" stroke-width="1.5" />

        <!-- Star -->
        <circle cx="55" cy="22" r="4" fill="url(#gradGold2)" />

        <!-- Open Book -->
        <path d="M 55,54 C 47,48 35,49 26,53 C 24,54 24,68 25,69 C 34,65 45,64 55,68 C 65,64 76,65 85,69 C 86,68 86,54 84,53 C 75,49 63,48 55,54 Z" fill="#ffffff" />
        <path d="M 55,54 L 55,68" stroke="#0d6b38" stroke-width="2" />

        <!-- Torch / Pen -->
        <path d="M 53,30 L 57,30 L 56,46 L 54,46 Z" fill="url(#gradGold2)" />
        <path d="M 55,24 C 57,26 59,28 58,31 C 56,33 54,33 52,31 C 51,28 53,26 55,24 Z" fill="url(#gradOrange2)" />

        <!-- Ribbon -->
        <path d="M 28,87 Q 55,96 82,87 L 85,93 Q 55,103 25,93 Z" fill="url(#gradOrange2)" />
    </g>

    <!-- Bottom Text on Arc / Ribbon -->
    <rect x="25" y="142" width="150" height="28" rx="14" fill="url(#gradGreen2)" stroke="url(#gradGold2)" stroke-width="1.5" />
    <text x="100" y="161" font-family="'Poppins', sans-serif" font-weight="900" font-size="13" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">
        SMA IT ROBBANI
    </text>
    <text x="100" y="184" font-family="'Poppins', sans-serif" font-weight="700" font-size="9" letter-spacing="1" fill="#ea580c" text-anchor="middle">
        PLUS • ISLAMIC SCHOOL
    </text>
</svg>
