<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
    <defs>
        <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#166534" />
            <stop offset="100%" stop-color="#0d6b38" />
        </linearGradient>
        <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fb923c" />
            <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>
        <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
        </filter>
    </defs>

    <!-- Shield Emblem Background -->
    <g transform="translate(10, 5)" filter="url(#dropShadow)">
        <!-- Outer Gold Rim -->
        <path d="M 55,5 Q 95,5 102,30 Q 105,75 55,105 Q 5,75 8,30 Q 15,5 55,5 Z" fill="url(#gradGold)" />
        <!-- Inner Dark Green Shield -->
        <path d="M 55,9 Q 91,9 97,32 Q 100,72 55,99 Q 10,72 13,32 Q 19,9 55,9 Z" fill="url(#gradGreen)" stroke="#ffffff" stroke-width="1.5" />

        <!-- Islamic Star / Crescent Element at Top -->
        <circle cx="55" cy="22" r="3.5" fill="url(#gradGold)" />
        <path d="M 55,14 L 56.5,19 L 61,19 L 57.5,22 L 59,27 L 55,24 L 51,27 L 52.5,22 L 49,19 L 53.5,19 Z" fill="url(#gradGold)" transform="scale(0.55) translate(45, 12)" />

        <!-- Open Book (Al-Qur'an / Science) -->
        <path d="M 55,54 C 47,48 35,49 26,53 C 24,54 24,68 25,69 C 34,65 45,64 55,68 C 65,64 76,65 85,69 C 86,68 86,54 84,53 C 75,49 63,48 55,54 Z" fill="#ffffff" />
        <!-- Book spine & inner pages -->
        <path d="M 55,54 L 55,68" stroke="#0d6b38" stroke-width="2" />
        <path d="M 30,56 C 37,53 46,53 53,57" stroke="#e2e8f0" stroke-width="1" fill="none" />
        <path d="M 80,56 C 73,53 64,53 57,57" stroke="#e2e8f0" stroke-width="1" fill="none" />

        <!-- Torch of Knowledge / Pen in Center -->
        <path d="M 53,30 L 57,30 L 56,46 L 54,46 Z" fill="url(#gradGold)" />
        <!-- Flame of Torch (Orange) -->
        <path d="M 55,24 C 57,26 59,28 58,31 C 56,33 54,33 52,31 C 51,28 53,26 55,24 Z" fill="url(#gradOrange)" />
        <circle cx="55" cy="29" r="1.5" fill="#ffffff" />

        <!-- Ribbons below shield -->
        <path d="M 30,86 Q 55,94 80,86 L 82,91 Q 55,100 28,91 Z" fill="url(#gradOrange)" />
        <!-- Miniature text or dots on ribbon -->
        <circle cx="43" cy="90" r="1" fill="#ffffff" />
        <circle cx="55" cy="92" r="1.2" fill="#ffffff" />
        <circle cx="67" cy="90" r="1" fill="#ffffff" />
    </g>

    <!-- Typography (Pure Crisp Vector) -->
    <!-- Brand Title: SMA IT PLUS -->
    <text x="132" y="52" font-family="'Poppins', sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#ffffff">
        SMA IT PLUS
    </text>
    
    <!-- Highlight Badge / Sub-Title: ROBBANI -->
    <g transform="translate(132, 60)">
        <rect x="0" y="0" width="170" height="34" rx="7" fill="url(#gradOrange)" />
        <text x="85" y="24" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" letter-spacing="3" fill="#ffffff" text-anchor="middle">
            ROBBANI
        </text>
    </g>

    <!-- Tagline: Islamic Integrated School -->
    <text x="312" y="72" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#fef08a" letter-spacing="1">
        UNGGUL, BERAKHLAK &amp; BERPRESTASI
    </text>
    <text x="312" y="88" font-family="'Poppins', sans-serif" font-weight="400" font-size="10.5" fill="#dcfce7" letter-spacing="0.5">
        Sekolah Menengah Atas Islam Terpadu
    </text>
</svg>
